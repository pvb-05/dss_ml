<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ Thống Gợi Ý Thực Đơn Thể Hình</title>
    <!-- Tích hợp Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center font-sans antialiased">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl border-t-4 border-green-500">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-800">HỆ THỐNG GỢI Ý THỰC ĐƠN DINH DƯỠNG</h1>
        <p class="text-gray-500 mt-2">Hỗ trợ lựa chọn thực đơn cho người tập thể hình</p>
      </div>

      {% if error %}
      <div class="mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-lg flex items-start space-x-3">
        <span class="text-red-500 text-xl font-bold">⚠️</span>
        <div>
          <h4 class="text-sm font-bold text-red-800">Dữ liệu nhập vào chưa hợp lệ:</h4>
          <p class="text-sm text-red-700 mt-1">{{ error }}</p>
        </div>
      </div>
      {% endif %}

      <form action="/predict" method="POST" class="space-y-6">
        <!-- Chia 2 cột cho các chỉ số cơ thể -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-sm font-semibold text-gray-700">Độ tuổi</label>
            </div>
            <input
              type="number"
              name="age"
              min="16"
              max="120"
              step="1"
              required
              value="{{ form_data.age if form_data else '' }}"
              placeholder="VD: 21"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" />
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-sm font-semibold text-gray-700">Giới tính</label>
            </div>
            <select
              name="gender"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none bg-white">
              <option value="nam" {% if form_data and form_data.gender == 'nam' %}selected{% endif %}>Nam</option>
              <option value="nu" {% if form_data and form_data.gender == 'nu' %}selected{% endif %}>Nữ</option>
            </select>
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-sm font-semibold text-gray-700">Chiều cao (cm)</label>
            </div>
            <input
              type="number"
              name="height"
              min="100"
              max="250"
              step="0.1"
              required
              value="{{ form_data.height if form_data else '' }}"
              placeholder="VD: 175"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" />
          </div>
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-sm font-semibold text-gray-700">Cân nặng (kg)</label>
            </div>
            <input
              type="number"
              name="weight"
              min="30"
              max="300"
              step="0.1"
              required
              value="{{ form_data.weight if form_data else '' }}"
              placeholder="VD: 68.5"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none" />
          </div>
        </div>

        <!-- Các chỉ số vận động và mục tiêu nằm ngang dòng đủ rộng -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Mức độ vận động</label>
          <select
            name="activity"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none bg-white">
            <option value="it_van_dong" {% if form_data and form_data.activity == 'it_van_dong' %}selected{% endif %}>Ít vận động (Không tập)</option>
            <option value="nhe" {% if form_data and form_data.activity == 'nhe' %}selected{% endif %}>Vận động nhẹ (Tập 1-3 ngày/tuần)</option>
            <option value="vua" {% if form_data and form_data.activity == 'vua' %}selected{% endif %}>Vận động vừa (Tập 3-5 ngày/tuần)</option>
            <option value="nhieu" {% if form_data and form_data.activity == 'nhieu' %}selected{% endif %}>Vận động nhiều (Tập nặng)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Mục tiêu tập luyện</label>
          <select
            name="goal"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-400 focus:outline-none bg-white">
            <option value="giam_mo" {% if form_data and form_data.goal == 'giam_mo' %}selected{% endif %}>Giảm Mỡ</option>
            <option value="giu_can" {% if form_data and form_data.goal == 'giu_can' %}selected{% endif %}>Giữ Dáng</option>
            <option value="tang_co" {% if form_data and form_data.goal == 'tang_co' %}selected{% endif %}>Tăng Cơ</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-2">Dị ứng (Tùy chọn)</label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-gray-50 p-4 rounded-lg border border-gray-200">
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                name="allergies"
                value="no_pork"
                {% if form_data and 'no_pork' in form_data.getlist('allergies') %}checked{% endif %}
                class="rounded border-gray-300 text-green-600 focus:ring-green-500 w-4 h-4" />
              <span class="ml-2 text-sm text-gray-700">Thịt lợn (heo)</span>
            </label>
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                name="allergies"
                value="no_beef"
                {% if form_data and 'no_beef' in form_data.getlist('allergies') %}checked{% endif %}
                class="rounded border-gray-300 text-green-600 focus:ring-green-500 w-4 h-4" />
              <span class="ml-2 text-sm text-gray-700">Thịt bò</span>
            </label>
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                name="allergies"
                value="no_seafood"
                {% if form_data and 'no_seafood' in form_data.getlist('allergies') %}checked{% endif %}
                class="rounded border-gray-300 text-green-600 focus:ring-green-500 w-4 h-4" />
              <span class="ml-2 text-sm text-gray-700">Hải sản (Cá, Tôm)</span>
            </label>
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                name="allergies"
                value="no_peanut"
                {% if form_data and 'no_peanut' in form_data.getlist('allergies') %}checked{% endif %}
                class="rounded border-gray-300 text-green-600 focus:ring-green-500 w-4 h-4" />
              <span class="ml-2 text-sm text-gray-700">Lạc (Đậu phộng)</span>
            </label>
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-md">
          Gợi Ý
        </button>
      </form>
    </div>
  </body>
</html>
